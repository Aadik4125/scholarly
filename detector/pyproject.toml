[project]
name = "detector"
version = "0.1.0"
description = "SCHOLARLY AI-text detector: training, evaluation and export"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
